name: Trading engine CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api-model/pyproject.toml
      - name: Install pinned direct dependencies
        run: python -m pip install -e './api-model[dev]'
      - name: Validate configuration, JSON, YAML, TOML, and Markdown
        run: |
          api-model validate-config
          python scripts/validate_repository.py
      - name: Lint and compile
        run: |
          ruff check --config api-model/pyproject.toml api-model scripts
          python -m compileall -q api-model/src scripts
      - name: Test all modules
        run: python -m pytest -c api-model/pyproject.toml api-model/tests --junitxml=results/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-python-${{ matrix.python-version }}
          path: results/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
