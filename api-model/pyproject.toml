[build-system]
requires = ["setuptools>=75,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "priya-api-model"
version = "0.1.0"
description = "Auditable historical learning and paper-only portfolio execution"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.6.1", "SQLAlchemy==2.1.8", "psycopg[binary]==3.3.9", "jsonschema==4.26.0", "exchange-calendars==4.13.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.17.5", "PyYAML==6.0.3", "markdown-it-py==3.0.0"]

[project.scripts]
api-model = "api_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api_model = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
